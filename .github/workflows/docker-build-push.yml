name: Build, Push and Deploy

on:
  push:
    branches: [main]
    paths:                      # only run when real source changes
      - "app/**"
      - "Dockerfile"
      - "requirements.txt"
      - "docker-compose.deploy.yml"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and smoke test
        run: |
          pip install -r requirements.txt httpx
          python -c "from fastapi.testclient import TestClient; from app.main import app; r = TestClient(app).get('/'); assert r.status_code == 200, r.text; print(r.json())"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapp:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapp:${{ github.sha }}

  deploy:
    needs: build                # runs only if build succeeded
    runs-on: self-hosted        # your laptop / classroom machine
    steps:
      - name: Checkout Code (to get the compose file)
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull and deploy with Docker Compose
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d
          docker compose -f docker-compose.deploy.yml ps
          docker image prune -f