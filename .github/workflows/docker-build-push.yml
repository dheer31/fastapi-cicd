name: Build, Push and Deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "requirements.txt"
      - "docker-compose.yml"
      - ".github/workflows/**"

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-push-deploy:
    runs-on: self-hosted
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show where this job runs
        shell: bash
        run: |
          echo "Host: $(hostname)"
          docker info --format 'Docker engine: {{.Name}}'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        shell: bash
        run: |
          docker build \
            -t "$DOCKERHUB_USERNAME/fastapp:latest" \
            -t "$DOCKERHUB_USERNAME/fastapp:$IMAGE_TAG" .

      - name: Smoke test (import the app inside the image)
        shell: bash
        run: |
          docker run --rm "$DOCKERHUB_USERNAME/fastapp:$IMAGE_TAG" \
            python -c "from app.main import app; print('Import OK:', app.title)"

      - name: Push to Docker Hub
        shell: bash
        run: |
          docker push "$DOCKERHUB_USERNAME/fastapp:latest"
          docker push "$DOCKERHUB_USERNAME/fastapp:$IMAGE_TAG"

      - name: Deploy with Docker Compose
        shell: bash
        run: |
          docker compose pull
          docker compose up -d --remove-orphans
          docker compose ps -a

      - name: Wait until container is healthy
        shell: bash
        run: |
          for i in $(seq 1 15); do
            status=$(docker inspect --format '{{.State.Health.Status}}' fastapi-cicd-demo 2>/dev/null || echo "missing")
            echo "Attempt