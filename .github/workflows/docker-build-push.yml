name: Build Push and Deploy FastAPI

on:
  push:
    branches:
      - main

jobs:

  build-push-deploy:

    runs-on: self-hosted

    steps:

      # 1. Get latest code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/student-fastapi:latest .

      # 4. Push image to Docker Hub
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/student-fastapi:latest

      # 5. Pull latest image using Docker Compose
      - name: Pull latest Docker image
        run: |
          docker compose pull

      # 6. Recreate containers
      - name: Deploy with Docker Compose
        run: |
          docker compose up -d

      # 7. Show running containers
      - name: Check containers
        run: |
          docker compose ps