services:
  api:
    image: ${DOCKERHUB_USERNAME:-local}/fastapp:${IMAGE_TAG:-latest}
    build: .
    container_name: fastapi-cicd-demo
    ports:
      - "8000:8000"
    environment:
      GIT_SHA: ${IMAGE_TAG:-unknown}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s